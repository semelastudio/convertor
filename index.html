<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rate</title>
<meta name="theme-color" content="#16233D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rate">
<style>
  :root{
    --ink:#16233D;
    --ink-soft:#2B3A57;
    --paper:#EEF1F5;
    --card:#FFFFFF;
    --gold:#C98A2C;
    --teal:#2E6E62;
    --line:#D8DEE7;
    --muted:#6B7686;
    --danger:#B14B3F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 20px 60px;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  .app{
    width:100%;
    max-width:400px;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 4px;
  }
  .masthead h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .masthead .updated{
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .base-card{
    background:var(--card);
    border-radius:20px;
    padding:18px 20px;
    box-shadow:0 1px 2px rgba(22,35,61,0.06), 0 12px 28px rgba(22,35,61,0.08);
    border:1px solid var(--line);
    margin-bottom:14px;
  }
  .base-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .select-wrap{
    position:relative;
    flex-shrink:0;
  }
  .select-wrap::after{
    content:"";
    position:absolute;
    right:2px;
    top:9px;
    width:7px;
    height:7px;
    border-right:1.5px solid var(--muted);
    border-bottom:1.5px solid var(--muted);
    transform:rotate(45deg);
    pointer-events:none;
  }
  .ccy-select{
    background:transparent;
    border:none;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    padding:2px 16px 4px 0;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .base-amount{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-size:34px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    padding:0;
    letter-spacing:-0.01em;
    text-align:right;
  }
  .base-amount:focus{outline:none;}

  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .ccy-row{
    background:var(--card);
    border-radius:16px;
    padding:14px 14px 14px 18px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .ccy-row .info{
    flex:1;
    min-width:0;
  }
  .ccy-row .code{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    color:var(--ink-soft);
  }
  .ccy-row .sub{
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .ccy-row .value{
    font-size:20px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .remove-btn{
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:18px;
    line-height:1;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .remove-btn:hover{ background:#F3E7E4; color:var(--danger); }

  .add-row{
    margin-top:14px;
  }
  .add-btn{
    width:100%;
    padding:13px 14px;
    border-radius:16px;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--muted);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .add-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .add-btn .plus{
    font-size:16px;
    font-weight:400;
  }

  .add-picker{
    margin-top:10px;
    display:none;
    gap:8px;
  }
  .add-picker.open{ display:flex; }
  .add-picker select{
    flex:1;
    padding:11px 12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:14px;
    color:var(--ink);
  }
  .add-picker button{
    padding:11px 16px;
    border-radius:12px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }

  .status{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    margin-top:16px;
    min-height:14px;
    padding:0 8px;
  }
  .status.error{ color:var(--danger); }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <h1>Rate</h1>
    <span class="updated" id="updatedLabel">—</span>
  </div>

  <div class="base-card">
    <div class="base-row">
      <div class="select-wrap">
        <select class="ccy-select" id="baseCcy" aria-label="Base currency"></select>
      </div>
      <input class="base-amount" id="baseAmount" inputmode="decimal" type="text" value="1" aria-label="Amount">
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="add-row">
    <button class="add-btn" id="addBtn"><span class="plus">+</span> Add currency</button>
    <div class="add-picker" id="addPicker">
      <select id="addSelect" aria-label="Choose currency to add"></select>
      <button id="addConfirm">Add</button>
    </div>
  </div>

  <div class="status" id="statusLine"></div>
</div>

<script>
const ALL_CURRENCIES = ["USD","EUR","GBP","NZD","AUD","JPY","CAD","CHF","CNY","INR","SGD","HKD","ZAR","SEK","NOK","MXN","BRL","AED","THB","KRW","PLN","DKK","ILS","IDR","PHP"];
const STORAGE_KEY = "rate-app-state-v2";
const DEFAULT_BASE = "USD";
const DEFAULT_LIST = ["EUR","GBP","NZD"];

const baseCcy = document.getElementById("baseCcy");
const baseAmount = document.getElementById("baseAmount");
const listEl = document.getElementById("list");
const updatedLabel = document.getElementById("updatedLabel");
const statusLine = document.getElementById("statusLine");
const addBtn = document.getElementById("addBtn");
const addPicker = document.getElementById("addPicker");
const addSelect = document.getElementById("addSelect");
const addConfirm = document.getElementById("addConfirm");

let rates = null;
let base = DEFAULT_BASE;
let targetList = [...DEFAULT_LIST];
let lastUpdated = null;

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    base, targetList, rates, lastUpdated
  }));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function populateBaseSelect(){
  baseCcy.innerHTML = "";
  ALL_CURRENCIES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    baseCcy.appendChild(opt);
  });
  baseCcy.value = base;
}

function populateAddSelect(){
  const available = ALL_CURRENCIES.filter(c => c !== base && !targetList.includes(c));
  addSelect.innerHTML = "";
  available.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    addSelect.appendChild(opt);
  });
  addBtn.style.display = available.length ? "flex" : "none";
}

function updateLabels(){
  if(lastUpdated){
    const d = new Date(lastUpdated);
    updatedLabel.textContent = d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) +
      " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }
}

async function fetchRates(){
  try{
    statusLine.textContent = "Updating rates…";
    statusLine.className = "status";
    const res = await fetch(`https://api.frankfurter.dev/v1/latest?base=${base}`);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    rates = data.rates;
    rates[base] = 1;
    lastUpdated = new Date().toISOString();
    saveState();
    statusLine.textContent = "";
    updateLabels();
    render();
  }catch(err){
    if(rates){
      statusLine.textContent = "Offline — showing last saved rates";
      statusLine.className = "status error";
      updateLabels();
      render();
    }else{
      statusLine.textContent = "Couldn't load rates. Check your connection.";
      statusLine.className = "status error";
    }
  }
}

function render(){
  listEl.innerHTML = "";
  const amt = parseFloat(baseAmount.value);

  targetList.forEach(code => {
    const rate = rates ? rates[code] : null;
    const row = document.createElement("div");
    row.className = "ccy-row";

    let valueText = "—";
    if(rate != null && !isNaN(amt)){
      const result = amt * rate;
      valueText = result < 1 ? result.toFixed(4) : result.toLocaleString(undefined,{maximumFractionDigits:2});
    }
    const rateText = rate != null ? `1 ${base} = ${rate.toFixed(4)} ${code}` : "rate unavailable";

    row.innerHTML = `
      <div class="info">
        <div class="code">${code}</div>
        <div class="sub">${rateText}</div>
      </div>
      <div class="value">${valueText}</div>
      <button class="remove-btn" aria-label="Remove ${code}" data-code="${code}">✕</button>
    `;
    listEl.appendChild(row);
  });

  listEl.querySelectorAll(".remove-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      targetList = targetList.filter(c => c !== btn.dataset.code);
      saveState();
      populateAddSelect();
      render();
    });
  });

  populateAddSelect();
}

baseAmount.addEventListener("input", () => {
  baseAmount.value = baseAmount.value.replace(/[^0-9.]/g,"");
  render();
});

baseCcy.addEventListener("change", async () => {
  base = baseCcy.value;
  targetList = targetList.filter(c => c !== base);
  saveState();
  await fetchRates();
});

addBtn.addEventListener("click", () => {
  addPicker.classList.toggle("open");
});

addConfirm.addEventListener("click", async () => {
  const code = addSelect.value;
  if(!code) return;
  targetList.push(code);
  addPicker.classList.remove("open");
  saveState();
  if(rates && rates[code] == null){
    await fetchRates();
  } else {
    populateAddSelect();
    render();
  }
});

async function init(){
  const saved = loadState();
  if(saved){
    base = saved.base || DEFAULT_BASE;
    targetList = saved.targetList || [...DEFAULT_LIST];
    rates = saved.rates || null;
    lastUpdated = saved.lastUpdated || null;
  }
  populateBaseSelect();
  baseCcy.value = base;
  updateLabels();
  if(rates) render();
  fetchRates();
}

init();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>

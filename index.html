<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>QuickConvertor</title>
<meta name="theme-color" content="#EEEEEE">
<link rel="manifest" href="manifest.json">
<link rel="icon" id="appIcon" type="image/png" href="icon/Icon-192.png">
<link rel="apple-touch-icon" id="appleIcon" href="icon/Icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuickConvertor">
<script>
(function(){
  try{
    var saved = localStorage.getItem("convertor-theme");
    var theme = (saved === "light" || saved === "dark")
      ? saved
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", theme === "dark" ? "#1A1A1A" : "#EEEEEE");
    var iconPath = theme === "dark" ? "icon/Icon-192-dark.png" : "icon/Icon-192.png";
    var appIcon = document.getElementById("appIcon");
    var appleIcon = document.getElementById("appleIcon");
    if(appIcon) appIcon.setAttribute("href", iconPath);
    if(appleIcon) appleIcon.setAttribute("href", iconPath);
  }catch(e){
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<style>
  :root{
    color-scheme: light dark;
  }
  /* Only the page background, header text, and the dashed add-currency
     button change with theme. Cards (base card, rows, settings panel)
     stay light with fixed navy ink, by design. */
  [data-theme="light"]{
    --paper:#EEEEEE;
    --page-ink:#1A1A1A;
    --page-muted:#8A8A8A;
    --dash-border:#B7B7B7;
  }
  [data-theme="dark"]{
    --paper:#1A1A1A;
    --page-ink:#F2F2F2;
    --page-muted:#9A9A9A;
    --dash-border:#5A5A5A;
  }
  :root{
    --card:#FFFFFF;
    --ink:#16233D;
    --muted:#8A8A8A;
    --accent:#FF3B00;
    --line:#E4E4E4;
    --toggle-track-off:#EEEEEE;
    --toggle-knob-off:#8D8D8D;
    --toggle-track-on:#FFC4B2;
    --toggle-knob-on:#FF3B00;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--page-ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 20px 0;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .app{
    width:100%;
    max-width:400px;
    position:relative;
  }

  /* ---------- Header ---------- */
  .masthead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:16px;
    padding:0 2px;
  }
  .masthead h1{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 2px;
    color:var(--page-ink);
  }
  .masthead h1 .light{
    font-weight:400;
  }
  .masthead .updated{
    font-size:12.5px;
    color:var(--page-muted);
    font-family:"DM Mono",monospace;
    font-variant-numeric:tabular-nums;
  }
  .icon-btn{
    border:none;
    background:transparent;
    color:var(--page-ink);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  /* ---------- Base amount card ---------- */
  .base-card{
    background:var(--card);
    border-radius:24px;
    padding:20px 22px;
    margin-bottom:14px;
  }
  .base-row{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .base-select-line{
    display:flex;
    align-items:center;
    position:relative;
  }
  .ccy-select{
    background:transparent;
    border:none;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.005em;
    color:var(--ink);
    padding:2px 22px 4px 0;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    max-width:100%;
  }
  .chevron{
    position:absolute;
    right:2px;
    top:50%;
    transform:translateY(-50%);
    width:11px;
    height:11px;
    pointer-events:none;
    color:var(--ink);
    opacity:0.55;
  }
  .base-amount{
    width:100%;
    border:none;
    background:transparent;
    font-size:38px;
    font-family:"DM Mono",monospace;
    font-weight:700;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    padding:0;
    letter-spacing:-0.01em;
    text-align:right;
  }
  .base-amount:focus{outline:none;}

  /* ---------- Currency rows ---------- */
  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .ccy-row{
    border-radius:22px;
    padding:14px 16px 14px 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .ccy-row.dragging{
    position:relative;
    z-index:30;
    box-shadow:0 12px 26px rgba(0,0,0,0.22);
  }
  .list.dragging-active .ccy-row:not(.dragging){
    transition:transform 150ms ease;
  }
  .drag-handle{
    width:20px;
    height:34px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    opacity:0.55;
    touch-action:none;
    cursor:grab;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .drag-handle svg circle{ fill:currentColor; }
  .ccy-row.dragging .drag-handle{ cursor:grabbing; opacity:0.9; }
  .ccy-row .info{
    flex:1;
    min-width:0;
  }
  .ccy-row .code-line{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .ccy-row .code{
    font-size:14px;
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  .ccy-row .name{
    font-size:13px;
    color:var(--ink);
    opacity:0.65;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .ccy-row .sub{
    font-size:12px;
    color:var(--ink);
    opacity:0.6;
    margin-top:2px;
    font-family:"DM Mono",monospace;
    font-variant-numeric:tabular-nums;
  }
  .row-amount{
    width:130px;
    flex-shrink:0;
    border:none;
    background:transparent;
    font-size:20px;
    font-family:"DM Mono",monospace;
    font-weight:800;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    padding:0;
    text-align:right;
  }
  .row-amount:focus{ outline:none; }
  .remove-btn{
    width:24px;
    height:24px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink);
    opacity:0.6;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:17px;
    line-height:1;
    transition:opacity 0.15s ease;
  }
  .remove-btn:hover{ opacity:1; }

  /* ---------- Add currency ---------- */
  .add-row{
    margin-top:14px;
  }
  .add-btn{
    width:100%;
    padding:15px 14px;
    border-radius:22px;
    border:2px dashed var(--dash-border);
    background:transparent;
    color:var(--page-ink);
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:border-color 0.15s ease, opacity 0.15s ease;
  }
  .add-btn:hover{ border-color:var(--accent); }
  .add-btn .plus{
    font-size:16px;
    font-weight:400;
  }

  .add-picker{
    margin-top:10px;
    display:none;
    flex-direction:column;
    gap:8px;
  }
  .add-picker.open{ display:flex; }
  .search-input{
    width:100%;
    padding:13px 15px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:16px;
    color:var(--ink);
  }
  .search-input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .search-results{
    max-height:240px;
    overflow-y:auto;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--card);
  }
  .search-item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:12px 15px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .search-item:last-child{ border-bottom:none; }
  .search-item:hover{ background:var(--paper); }
  .search-item .code{
    font-size:13.5px;
    font-weight:800;
    letter-spacing:0.02em;
    color:var(--ink);
    flex-shrink:0;
  }
  .search-item .name{
    font-size:12.5px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .search-empty{
    padding:14px;
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
  }

  .status{
    text-align:center;
    font-size:11.5px;
    color:var(--page-muted);
    margin-top:16px;
    min-height:14px;
    padding:0 8px;
  }
  .status.error{ color:var(--accent); }

  /* ---------- Settings overlay ---------- */
  .settings-overlay{
    position:fixed;
    inset:0;
    background:var(--paper);
    z-index:100;
    padding:calc(24px + env(safe-area-inset-top)) 20px 0;
    display:flex;
    justify-content:center;
    visibility:hidden;
    transition:visibility 0s linear 0.25s;
    pointer-events:none;
  }
  .settings-overlay.open{
    visibility:visible;
    transition-delay:0s;
    pointer-events:auto;
  }
  .settings-inner{
    width:100%;
    max-width:400px;
    height:100%;
  }
  .settings-card{
    background:var(--card);
    border-radius:24px 24px 0 0;
    padding:22px 20px;
    height:100%;
    box-shadow:0 1px 2px rgba(22,35,61,0.05), 0 10px 24px rgba(22,35,61,0.07);
    transform:translateY(100%);
    transition:transform 0.25s ease;
    will-change:transform;
    backface-visibility:hidden;
  }
  .settings-overlay.open .settings-card{
    transform:translateY(0);
  }
  .settings-group + .settings-group{
    margin-top:22px;
  }
  .settings-title{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
    padding:0 2px;
  }
  .settings-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 2px;
  }
  .settings-row .row-label{
    font-size:16px;
    color:var(--ink);
    font-weight:700;
  }
  .settings-row .row-value{
    font-size:14px;
    color:var(--muted);
  }
  .settings-row .row-value.numeric{
    font-family:"DM Mono",monospace;
  }
  .settings-link{
    font-size:14.5px;
    color:var(--accent);
    font-weight:700;
    text-decoration:underline;
  }
  .settings-link:active{ opacity:0.7; }
  .theme-switch{
    width:48px;
    height:28px;
    border-radius:999px;
    border:none;
    background:var(--toggle-track-off);
    position:relative;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
    transition:background 0.2s ease;
  }
  .theme-switch .knob{
    position:absolute;
    top:3px;
    left:3px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--toggle-knob-off);
    transition:transform 0.2s ease, background 0.2s ease;
  }
  .theme-switch[aria-checked="true"]{
    background:var(--toggle-track-on);
  }
  .theme-switch[aria-checked="true"] .knob{
    transform:translateX(20px);
    background:var(--toggle-knob-on);
  }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <div>
      <h1>Quick<span class="light">Convertor</span></h1>
      <span class="updated" id="updatedLabel">—</span>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Open settings">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="1" x2="22" y2="1"/>
        <line x1="0" y1="8" x2="22" y2="8"/>
        <line x1="0" y1="15" x2="22" y2="15"/>
      </svg>
    </button>
  </div>

  <div class="base-card">
    <div class="base-row">
      <div class="base-select-line">
        <select class="ccy-select" id="baseCcy" aria-label="Base currency"></select>
        <svg class="chevron" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1.5L6 6.5L11 1.5"/>
        </svg>
      </div>
      <input class="base-amount" id="baseAmount" inputmode="decimal" type="text" value="1" aria-label="Amount">
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="add-row">
    <button class="add-btn" id="addBtn"><span class="plus">+</span> Add currency</button>
    <div class="add-picker" id="addPicker">
      <input class="search-input" id="searchInput" type="text" placeholder="Search by code or name…" aria-label="Search currency" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="status" id="statusLine"></div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-inner">
    <div class="masthead">
      <div>
        <h1>Quick<span class="light">Convertor</span></h1>
        <span class="updated" id="updatedLabelSettings">—</span>
      </div>
      <button class="icon-btn" id="closeMenuBtn" aria-label="Close settings">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="1" y1="1" x2="17" y2="17"/>
          <line x1="17" y1="1" x2="1" y2="17"/>
        </svg>
      </button>
    </div>

    <div class="settings-card">
      <div class="settings-group">
        <div class="settings-title">Settings</div>
        <div class="settings-row">
          <span class="row-label">Dark mode</span>
          <button class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Toggle dark mode">
            <span class="knob"></span>
          </button>
        </div>
        <div class="settings-row">
          <span class="row-label">Refresh</span>
          <a href="#" class="settings-link" id="refreshLink">Refresh</a>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-title">About</div>
        <div class="settings-row">
          <span class="row-label">Version</span>
          <span class="row-value numeric">v0.1 Alpha</span>
        </div>
        <div class="settings-row">
          <span class="row-label">Developer</span>
          <span class="row-value">Semela Studio</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const THEME_KEY = "convertor-theme";
const themeSwitch = document.getElementById("themeSwitch");
const themeColorMeta = document.querySelector('meta[name="theme-color"]');
const refreshLink = document.getElementById("refreshLink");
const menuBtn = document.getElementById("menuBtn");
const closeMenuBtn = document.getElementById("closeMenuBtn");
const settingsOverlay = document.getElementById("settingsOverlay");

function systemPrefersDark(){
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  themeSwitch.setAttribute("aria-checked", theme === "dark" ? "true" : "false");
  const iconPath = theme === "dark" ? "icon/Icon-192-dark.png" : "icon/Icon-192.png";
  const appIcon = document.getElementById("appIcon");
  const appleIcon = document.getElementById("appleIcon");
  if(appIcon) appIcon.setAttribute("href", iconPath);
  if(appleIcon) appleIcon.setAttribute("href", iconPath);
  if(themeColorMeta){
    themeColorMeta.setAttribute("content", theme === "dark" ? "#1A1A1A" : "#EEEEEE");
  }
}

applyTheme(document.documentElement.getAttribute("data-theme") || "light");

themeSwitch.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const handleSystemChange = (e) => {
    if(!localStorage.getItem(THEME_KEY)){
      applyTheme(e.matches ? "dark" : "light");
    }
  };
  if(mq.addEventListener){
    mq.addEventListener("change", handleSystemChange);
  }else if(mq.addListener){
    mq.addListener(handleSystemChange);
  }
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && !localStorage.getItem(THEME_KEY)){
    applyTheme(systemPrefersDark() ? "dark" : "light");
  }
});
window.addEventListener("pageshow", () => {
  if(!localStorage.getItem(THEME_KEY)){
    applyTheme(systemPrefersDark() ? "dark" : "light");
  }
});

if(refreshLink){
  refreshLink.addEventListener("click", (e) => {
    e.preventDefault();
    window.location.reload();
  });
}

menuBtn.addEventListener("click", () => {
  settingsOverlay.classList.add("open");
});
closeMenuBtn.addEventListener("click", () => {
  settingsOverlay.classList.remove("open");
});

  UAH:"Ukrainian Hryvnia", UGX:"Ugandan Shilling", USD:"US Dollar", UYU:"Uruguayan Peso",
  UZS:"Uzbekistani Som", VES:"Venezuelan Bolívar", VND:"Vietnamese Dong", VUV:"Vanuatu Vatu",
  WST:"Samoan Tala", XAF:"Central African CFA Franc", XCD:"East Caribbean Dollar",
  XOF:"West African CFA Franc", XPF:"CFP Franc", YER:"Yemeni Rial", ZAR:"South African Rand",
  ZMW:"Zambian Kwacha", ZWL:"Zimbabwean Dollar"
};
const ALL_CURRENCIES = Object.keys(CURRENCY_NAMES);
const STORAGE_KEY = "rate-app-state-v3";
const DEFAULT_BASE = "USD";
const DEFAULT_LIST = ["EUR","GBP","NZD"];

// Row background colors, cycling per position — matches the design's
// rotating palette (yellow, pink, teal, lime, mauve).
const ROW_COLORS = ["#FFCF3C", "#FFB7F4", "#A8D8DA", "#C7D96B", "#C2B1B1"];

const baseCcy = document.getElementById("baseCcy");
const baseAmount = document.getElementById("baseAmount");
const listEl = document.getElementById("list");
const updatedLabel = document.getElementById("updatedLabel");
const updatedLabelSettings = document.getElementById("updatedLabelSettings");
const statusLine = document.getElementById("statusLine");
const addBtn = document.getElementById("addBtn");
const addPicker = document.getElementById("addPicker");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

let rates = null;
let base = DEFAULT_BASE;
let targetList = [...DEFAULT_LIST];
let lastUpdated = null;
let baseValue = 1;

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    base, targetList, rates, lastUpdated, baseValue
  }));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function ccyLabel(code){
  return `${code} — ${CURRENCY_NAMES[code] || ""}`;
}

function populateBaseSelect(){
  baseCcy.innerHTML = "";
  ALL_CURRENCIES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = ccyLabel(c);
    baseCcy.appendChild(opt);
  });
  baseCcy.value = base;
}

function availableCurrencies(){
  return ALL_CURRENCIES.filter(c => c !== base && !targetList.includes(c));
}

function renderSearchResults(){
  const available = availableCurrencies();
  addBtn.style.display = available.length ? "flex" : "none";

  const query = searchInput.value.trim().toLowerCase();
  const matches = query
    ? available.filter(c =>
        c.toLowerCase().includes(query) ||
        (CURRENCY_NAMES[c] || "").toLowerCase().includes(query))
    : available;

  searchResults.innerHTML = "";

  if(matches.length === 0){
    const empty = document.createElement("div");
    empty.className = "search-empty";
    empty.textContent = "No currency matches that search";
    searchResults.appendChild(empty);
    return;
  }

  matches.forEach(code => {
    const item = document.createElement("div");
    item.className = "search-item";
    item.innerHTML = `<span class="code">${code}</span><span class="name">${CURRENCY_NAMES[code] || ""}</span>`;
    item.addEventListener("click", () => addCurrency(code));
    searchResults.appendChild(item);
  });
}

async function addCurrency(code){
  targetList.push(code);
  addPicker.classList.remove("open");
  searchInput.value = "";
  saveState();
  if(rates && rates[code] == null){
    await fetchRates();
  } else {
    buildList();
  }
}

function updateLabels(){
  if(lastUpdated){
    const d = new Date(lastUpdated);
    const text = "Updated: " + d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) +
      " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
    updatedLabel.textContent = text;
    updatedLabelSettings.textContent = text;
  }
}

function fmt(n){
  if(isNaN(n)) return "";
  return n < 1 ? n.toFixed(4) : n.toLocaleString(undefined,{maximumFractionDigits:2});
}

// Shrinks an input's font as its text gets longer, so long numbers
// never clip instead of overflowing the field.
function autosize(el, maxSize, minSize){
  const len = el.value.length || 1;
  const threshold = 6;
  let size = maxSize;
  if(len > threshold){
    size = Math.max(minSize, maxSize - (len - threshold) * 1.8);
  }
  el.style.fontSize = size + "px";
}
function autosizeBase(){ autosize(baseAmount, 38, 20); }
function autosizeRow(input){ autosize(input, 20, 16); }

async function fetchRates(){
  try{
    statusLine.textContent = "Updating rates…";
    statusLine.className = "status";
    const res = await fetch(`https://open.er-api.com/v6/latest/${base}`);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    if(data.result !== "success") throw new Error("api error");
    rates = data.rates;
    rates[base] = 1;
    lastUpdated = data.time_last_update_utc ? new Date(data.time_last_update_utc).toISOString() : new Date().toISOString();
    saveState();
    statusLine.textContent = "";
    updateLabels();
    buildList();
  }catch(err){
    if(rates){
      statusLine.textContent = "Offline — showing last saved rates";
      statusLine.className = "status error";
      updateLabels();
      buildList();
    }else{
      statusLine.textContent = "Couldn't load rates. Check your connection.";
      statusLine.className = "status error";
    }
  }
}

// Rebuilds the row DOM structure. Call only when the list itself, the base
// currency, or freshly fetched rates change — not on every keystroke.
function buildList(){
  listEl.innerHTML = "";

  targetList.forEach((code, index) => {
    const rate = rates ? rates[code] : null;
    const row = document.createElement("div");
    row.className = "ccy-row";
    row.dataset.code = code;
    row.style.background = ROW_COLORS[index % ROW_COLORS.length];

    const rateText = rate != null ? `1 ${base} = ${rate.toFixed(4)} ${code}` : "rate unavailable";
    const value = rate != null ? fmt(baseValue * rate) : "";

    row.innerHTML = `
      <div class="drag-handle" aria-label="Drag to reorder ${code}">
        <svg viewBox="0 0 12 20" width="12" height="20">
          <circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/>
          <circle cx="3" cy="10" r="1.6"/><circle cx="9" cy="10" r="1.6"/>
          <circle cx="3" cy="17" r="1.6"/><circle cx="9" cy="17" r="1.6"/>
        </svg>
      </div>
      <div class="info">
        <div class="code-line">
          <span class="code">${code}</span>
          <span class="name">${CURRENCY_NAMES[code] || ""}</span>
        </div>
        <div class="sub">${rateText}</div>
      </div>
      <input class="row-amount" type="text" inputmode="decimal" value="${value}" aria-label="${code} amount">
      <button class="remove-btn" aria-label="Remove ${code}" data-code="${code}">✕</button>
    `;
    listEl.appendChild(row);

    const input = row.querySelector(".row-amount");
    autosizeRow(input);
    input.addEventListener("focus", () => input.select());
    input.addEventListener("input", () => {
      input.value = input.value.replace(/[^0-9.]/g, "");
      onRowEdit(code, input.value);
    });

    row.querySelector(".remove-btn").addEventListener("click", () => {
      targetList = targetList.filter(c => c !== code);
      saveState();
      buildList();
      renderSearchResults();
    });

    bindDragHandle(row);
  });

  renderSearchResults();
}

// Touch/mouse-friendly drag reordering using Pointer Events (works on
// mobile, unlike HTML5 drag-and-drop). Dragged row follows the finger;
// other rows slide to open a gap; order is committed on release.
function bindDragHandle(row){
  const handle = row.querySelector(".drag-handle");
  let dragging = false;
  let startY = 0;
  let pitch = 0;
  let draggedIndex = 0;
  let targetIndex = 0;
  let rowsSnapshot = [];

  function onPointerDown(e){
    e.preventDefault();
    dragging = true;
    startY = e.clientY;
    rowsSnapshot = Array.from(listEl.querySelectorAll(".ccy-row"));
    draggedIndex = rowsSnapshot.indexOf(row);
    targetIndex = draggedIndex;
    const tops = rowsSnapshot.map(r => r.getBoundingClientRect().top);
    pitch = rowsSnapshot.length > 1 ? (tops[1] - tops[0]) : (row.offsetHeight + 12);
    listEl.classList.add("dragging-active");
    row.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
    handle.addEventListener("pointermove", onPointerMove);
    handle.addEventListener("pointerup", onPointerUp);
    handle.addEventListener("pointercancel", onPointerUp);
  }

  function onPointerMove(e){
    if(!dragging) return;
    const deltaY = e.clientY - startY;
    row.style.transform = `translateY(${deltaY}px)`;

    let newIndex = draggedIndex + Math.round(deltaY / pitch);
    newIndex = Math.max(0, Math.min(rowsSnapshot.length - 1, newIndex));
    if(newIndex === targetIndex) return;
    targetIndex = newIndex;

    rowsSnapshot.forEach((r, i) => {
      if(r === row) return;
      let shift = 0;
      if(draggedIndex < targetIndex && i > draggedIndex && i <= targetIndex){
        shift = -pitch;
      } else if(draggedIndex > targetIndex && i >= targetIndex && i < draggedIndex){
        shift = pitch;
      }
      r.style.transform = shift ? `translateY(${shift}px)` : "";
    });
  }

  function onPointerUp(e){
    if(!dragging) return;
    dragging = false;
    handle.releasePointerCapture(e.pointerId);
    handle.removeEventListener("pointermove", onPointerMove);
    handle.removeEventListener("pointerup", onPointerUp);
    handle.removeEventListener("pointercancel", onPointerUp);

    row.classList.remove("dragging");
    listEl.classList.remove("dragging-active");
    rowsSnapshot.forEach(r => { r.style.transform = ""; });

    if(targetIndex !== draggedIndex){
      const [moved] = targetList.splice(draggedIndex, 1);
      targetList.splice(targetIndex, 0, moved);
      saveState();
      buildList();
    }
  }

  handle.addEventListener("pointerdown", onPointerDown);
}

// Updates every input's displayed value from the current baseValue,
// without rebuilding the DOM (so focus/cursor position is preserved).
function refreshValues(skipCode){
  baseAmount.value = fmt(baseValue) || baseAmount.value;
  autosizeBase();

  listEl.querySelectorAll(".ccy-row").forEach(row => {
    const code = row.dataset.code;
    if(code === skipCode) return;
    const rate = rates ? rates[code] : null;
    const input = row.querySelector(".row-amount");
    if(rate != null){
      input.value = fmt(baseValue * rate);
      autosizeRow(input);
    }
  });
}

function onBaseEdit(){
  const amt = parseFloat(baseAmount.value);
  baseValue = isNaN(amt) ? 0 : amt;
  autosizeBase();
  refreshValues(null);
}

function onRowEdit(code, rawValue){
  if(!rates || rates[code] == null) return;
  const amt = parseFloat(rawValue);
  const numeric = isNaN(amt) ? 0 : amt;
  baseValue = numeric / rates[code];
  const editedInput = listEl.querySelector(`.ccy-row[data-code="${code}"] .row-amount`);
  if(editedInput) autosizeRow(editedInput);
  refreshValues(code);
}

baseAmount.addEventListener("focus", () => baseAmount.select());
baseAmount.addEventListener("input", () => {
  baseAmount.value = baseAmount.value.replace(/[^0-9.]/g,"");
  autosizeBase();
  onBaseEdit();
});

baseCcy.addEventListener("change", async () => {
  base = baseCcy.value;
  targetList = targetList.filter(c => c !== base);
  saveState();
  await fetchRates();
});

addBtn.addEventListener("click", () => {
  addPicker.classList.toggle("open");
  if(addPicker.classList.contains("open")){
    renderSearchResults();
    searchInput.focus();
  }
});

searchInput.addEventListener("input", renderSearchResults);

async function init(){
  const saved = loadState();
  if(saved){
    base = saved.base || DEFAULT_BASE;
    targetList = saved.targetList || [...DEFAULT_LIST];
    rates = saved.rates || null;
    lastUpdated = saved.lastUpdated || null;
    baseValue = typeof saved.baseValue === "number" ? saved.baseValue : 1;
  }
  populateBaseSelect();
  baseCcy.value = base;
  baseAmount.value = fmt(baseValue);
  autosizeBase();
  updateLabels();
  if(rates) buildList();
  fetchRates();
}

init();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>QuickConvertor</title>
<meta name="description" content="A simple, fast, offline-capable currency converter.">
<meta name="theme-color" content="#EEEEEE">
<link rel="manifest" href="manifest.json">
<link rel="icon" id="appIcon" type="image/png" href="icon/Icon-192.png">
<link rel="apple-touch-icon" id="appleIcon" href="icon/Icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuickConvertor">

<!-- Google Fonts is a third-party, render-blocking request. Preconnect warms
     the TCP/TLS handshake, and loading the stylesheet as media="print" then
     flipping it to "all" on load makes it non-blocking: the UI paints in the
     system font immediately and swaps to DM Mono when it arrives. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
</noscript>

<script>
/* ------------------------------------------------------------------
   Theme bootstrap — must stay inline and run before first paint.

   Anything async here would show a flash of the wrong background on
   launch. It only sets the data-theme attribute plus the theme-dependent
   icons/status bar colour; all real theme logic lives in the main script.
   ------------------------------------------------------------------ */
(function(){
  try{
    var saved = localStorage.getItem("convertor-theme");
    // An explicit user choice always wins; otherwise follow the OS setting.
    var theme = (saved === "light" || saved === "dark")
      ? saved
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);

    var isDark = theme === "dark";
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", isDark ? "#1A1A1A" : "#EEEEEE");

    var iconPath = isDark ? "icon/Icon-192-dark.png" : "icon/Icon-192.png";
    var appIcon = document.getElementById("appIcon");
    var appleIcon = document.getElementById("appleIcon");
    if(appIcon) appIcon.setAttribute("href", iconPath);
    if(appleIcon) appleIcon.setAttribute("href", iconPath);
  }catch(e){
    // Private-mode Safari can throw on localStorage. Light is the safe default.
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>

<style>
  /* ==========================================================
     Design tokens
     Only the page background, header text and the dashed
     add-currency button react to the theme. Cards (base card,
     currency rows, settings panel) stay light with fixed navy
     ink, by design.
     ========================================================== */
  :root{
    color-scheme: light dark;

    /* Theme-independent card palette */
    --card:#FFFFFF;
    --ink:#16233D;
    --muted:#8A8A8A;
    --accent:#FF3B00;
    --line:#E4E4E4;
    --toggle-track-off:#EEEEEE;
    --toggle-knob-off:#8D8D8D;
    --toggle-track-on:#FFC4B2;
    --toggle-knob-on:#FF3B00;

    /* Shared metrics, so row gap and radii are edited in one place */
    --row-gap:12px;
    --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="light"]{
    --paper:#EEEEEE;
    --page-ink:#1A1A1A;
    --page-muted:#8A8A8A;
    --dash-border:#B7B7B7;
  }
  [data-theme="dark"]{
    --paper:#1A1A1A;
    --page-ink:#F2F2F2;
    --page-muted:#9A9A9A;
    --dash-border:#5A5A5A;
  }

  /* ==========================================================
     Base layout
     ========================================================== */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    font-family:var(--font-ui);
    color:var(--page-ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 20px 0;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .app{
    width:100%;
    max-width:400px;
    position:relative;
  }
  /* Buttons should react instantly to taps rather than waiting out the
     300ms double-tap-to-zoom delay. */
  button,.settings-link,.search-item{touch-action:manipulation;}

  /* ---------- Header ---------- */
  .masthead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:16px;
    padding:0 2px;
  }
  .masthead h1{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 2px;
    color:var(--page-ink);
  }
  .masthead h1 .light{
    font-weight:400;
  }
  .masthead .updated{
    font-size:12.5px;
    color:var(--page-muted);
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
  }
  .icon-btn{
    border:none;
    background:transparent;
    color:var(--page-ink);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  /* ---------- Base amount card ---------- */
  .base-card{
    background:var(--card);
    border-radius:24px;
    padding:20px 22px;
    margin-bottom:14px;
  }
  .base-row{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .base-select-line{
    display:flex;
    align-items:center;
    position:relative;
  }
  .ccy-select{
    background:transparent;
    border:none;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.005em;
    color:var(--ink);
    padding:2px 22px 4px 0;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    max-width:100%;
  }
  .chevron{
    position:absolute;
    right:2px;
    top:50%;
    transform:translateY(-50%);
    width:11px;
    height:11px;
    pointer-events:none;   /* clicks fall through to the select underneath */
    color:var(--ink);
    opacity:0.55;
  }
  .base-amount{
    width:100%;
    border:none;
    background:transparent;
    font-size:38px;
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    padding:0;
    letter-spacing:-0.01em;
    text-align:right;
  }
  .base-amount:focus{outline:none;}

  /* ---------- Currency rows ---------- */
  .list{
    display:flex;
    flex-direction:column;
    gap:var(--row-gap);
  }
  .ccy-row{
    border-radius:22px;
    padding:14px 16px 14px 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  /* The row under the finger lifts above its neighbours while dragging.
     will-change is scoped to this state so idle rows keep no extra
     compositor layers. */
  .ccy-row.dragging{
    position:relative;
    z-index:30;
    box-shadow:0 12px 26px rgba(0,0,0,0.22);
    will-change:transform;
  }
  .list.dragging-active .ccy-row:not(.dragging){
    transition:transform 150ms ease;
  }
  .drag-handle{
    width:20px;
    height:34px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    opacity:0.55;
    touch-action:none;         /* stops the browser scrolling mid-drag */
    cursor:grab;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .drag-handle svg circle{ fill:currentColor; }
  .ccy-row.dragging .drag-handle{ cursor:grabbing; opacity:0.9; }
  .ccy-row .info{
    flex:1;
    min-width:0;               /* lets the name ellipsis instead of pushing */
  }
  .ccy-row .code-line{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .ccy-row .code{
    font-size:14px;
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  .ccy-row .name{
    font-size:13px;
    color:var(--ink);
    opacity:0.65;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .ccy-row .sub{
    font-size:12px;
    color:var(--ink);
    opacity:0.6;
    margin-top:2px;
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
  }
  .row-amount{
    width:130px;
    flex-shrink:0;
    border:none;
    background:transparent;
    font-size:20px;
    font-family:var(--font-mono);
    font-weight:800;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    padding:0;
    text-align:right;
  }
  .row-amount:focus{ outline:none; }
  .remove-btn{
    width:24px;
    height:24px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink);
    opacity:0.6;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:17px;
    line-height:1;
    transition:opacity 0.15s ease;
  }
  .remove-btn:hover{ opacity:1; }

  /* ---------- Add currency ---------- */
  .add-row{
    margin-top:14px;
  }
  .add-btn{
    width:100%;
    padding:15px 14px;
    border-radius:22px;
    border:2px dashed var(--dash-border);
    background:transparent;
    color:var(--page-ink);
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:border-color 0.15s ease, opacity 0.15s ease;
  }
  .add-btn:hover{ border-color:var(--accent); }
  .add-btn .plus{
    font-size:16px;
    font-weight:400;
  }

  .add-picker{
    margin-top:10px;
    display:none;
    flex-direction:column;
    gap:8px;
  }
  .add-picker.open{ display:flex; }
  .search-input{
    width:100%;
    padding:13px 15px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:16px;            /* 16px keeps iOS from zooming on focus */
    color:var(--ink);
  }
  .search-input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .search-results{
    max-height:240px;
    overflow-y:auto;
    overscroll-behavior:contain;  /* scrolling the list won't drag the page */
    -webkit-overflow-scrolling:touch;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--card);
  }
  .search-item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:12px 15px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .search-item:last-child{ border-bottom:none; }
  .search-item:hover{ background:var(--paper); }
  .search-item .code{
    font-size:13.5px;
    font-weight:800;
    letter-spacing:0.02em;
    color:var(--ink);
    flex-shrink:0;
  }
  .search-item .name{
    font-size:12.5px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .search-empty{
    padding:14px;
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
  }

  /* ---------- Status line ---------- */
  .status{
    text-align:center;
    font-size:11.5px;
    color:var(--page-muted);
    margin-top:16px;
    min-height:14px;           /* reserved height stops layout shift */
    padding:0 8px;
  }
  .status.error{ color:var(--accent); }

  /* ---------- Settings overlay ---------- */
  /* Kept in the DOM and hidden with visibility so the slide-up transition
     can run. The delayed visibility transition lets the card finish sliding
     out before the layer disappears. */
  .settings-overlay{
    position:fixed;
    inset:0;
    background:var(--paper);
    z-index:100;
    padding:calc(24px + env(safe-area-inset-top)) 20px 0;
    display:flex;
    justify-content:center;
    visibility:hidden;
    transition:visibility 0s linear 0.25s;
    pointer-events:none;
  }
  .settings-overlay.open{
    visibility:visible;
    transition-delay:0s;
    pointer-events:auto;
  }
  .settings-inner{
    width:100%;
    max-width:400px;
    height:100%;
  }
  .settings-card{
    background:var(--card);
    border-radius:24px 24px 0 0;
    padding:22px 20px;
    height:100%;
    box-shadow:0 1px 2px rgba(22,35,61,0.05), 0 10px 24px rgba(22,35,61,0.07);
    transform:translateY(100%);
    transition:transform 0.25s ease;
    will-change:transform;
    backface-visibility:hidden;
  }
  .settings-overlay.open .settings-card{
    transform:translateY(0);
  }
  .settings-group + .settings-group{
    margin-top:22px;
  }
  .settings-title{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
    padding:0 2px;
  }
  .settings-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 2px;
  }
  .settings-row .row-label{
    font-size:16px;
    color:var(--ink);
    font-weight:700;
  }
  .settings-row .row-value{
    font-size:14px;
    color:var(--muted);
  }
  .settings-row .row-value.numeric{
    font-family:var(--font-mono);
  }
  .settings-link{
    font-size:14.5px;
    color:var(--accent);
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
  }
  .settings-link:active{ opacity:0.7; }
  .settings-link[aria-disabled="true"]{ opacity:0.5; pointer-events:none; }
  .theme-switch{
    width:48px;
    height:28px;
    border-radius:999px;
    border:none;
    background:var(--toggle-track-off);
    position:relative;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
    transition:background 0.2s ease;
  }
  .theme-switch .knob{
    position:absolute;
    top:3px;
    left:3px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--toggle-knob-off);
    transition:transform 0.2s ease, background 0.2s ease;
  }
  .theme-switch[aria-checked="true"]{
    background:var(--toggle-track-on);
  }
  .theme-switch[aria-checked="true"] .knob{
    transform:translateX(20px);
    background:var(--toggle-knob-on);
  }

  /* Respect the OS "reduce motion" setting: keep every state change, drop
     the animation between states. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.01ms !important;
      transition-duration:0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <div>
      <h1>Quick<span class="light">Convertor</span></h1>
      <span class="updated" id="updatedLabel">—</span>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Open settings" aria-expanded="false" aria-controls="settingsOverlay">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="0" y1="1" x2="22" y2="1"/>
        <line x1="0" y1="8" x2="22" y2="8"/>
        <line x1="0" y1="15" x2="22" y2="15"/>
      </svg>
    </button>
  </div>

  <!-- Base currency + the amount every row is derived from -->
  <div class="base-card">
    <div class="base-row">
      <div class="base-select-line">
        <select class="ccy-select" id="baseCcy" aria-label="Base currency"></select>
        <svg class="chevron" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 1.5L6 6.5L11 1.5"/>
        </svg>
      </div>
      <input class="base-amount" id="baseAmount" inputmode="decimal" type="text" value="1" autocomplete="off" aria-label="Amount">
    </div>
  </div>

  <!-- Converted currency rows, rendered by buildList() -->
  <div class="list" id="list"></div>

  <div class="add-row">
    <button class="add-btn" id="addBtn" aria-expanded="false" aria-controls="addPicker"><span class="plus" aria-hidden="true">+</span> Add currency</button>
    <div class="add-picker" id="addPicker">
      <input class="search-input" id="searchInput" type="text" placeholder="Search by code or name…" aria-label="Search currency" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- Network / freshness messages. aria-live so it is announced. -->
  <div class="status" id="statusLine" role="status" aria-live="polite"></div>
</div>

<!-- Settings sheet. inert + aria-hidden keep it out of the tab order and off
     the accessibility tree while closed. -->
<div class="settings-overlay" id="settingsOverlay" aria-hidden="true" inert>
  <div class="settings-inner">
    <div class="masthead">
      <div>
        <h1>Quick<span class="light">Convertor</span></h1>
        <span class="updated" id="updatedLabelSettings">—</span>
      </div>
      <button class="icon-btn" id="closeMenuBtn" aria-label="Close settings">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="1" y1="1" x2="17" y2="17"/>
          <line x1="17" y1="1" x2="1" y2="17"/>
        </svg>
      </button>
    </div>

    <div class="settings-card">
      <div class="settings-group">
        <div class="settings-title">Settings</div>
        <div class="settings-row">
          <span class="row-label" id="darkModeLabel">Dark mode</span>
          <button class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-labelledby="darkModeLabel">
            <span class="knob"></span>
          </button>
        </div>
        <div class="settings-row">
          <span class="row-label">Refresh</span>
          <a href="#" class="settings-link" id="refreshLink" role="button">Refresh</a>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-title">About</div>
        <div class="settings-row">
          <span class="row-label">Version</span>
          <span class="row-value numeric">v0.1.1</span>
        </div>
        <div class="settings-row">
          <span class="row-label">Developer</span>
          <span class="row-value">Semela Studio</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ==================================================================
   QuickConvertor

   A single-page currency converter. Rates come from open.er-api.com,
   are cached in localStorage, and the whole UI works offline from that
   cache. Structure below:

     1. Constants and currency data
     2. DOM references
     3. State and persistence
     4. Number formatting and parsing
     5. Rates: fetching, freshness, offline rebasing
     6. Rendering: base picker, rows, search
     7. Interaction: amount edits, drag reorder, settings, theme
     8. Boot
   ================================================================== */


/* ============ 1. Constants and currency data ============ */

  NAD:"Namibian Dollar", NGN:"Nigerian Naira", NIO:"Nicaraguan Córdoba", NOK:"Norwegian Krone",
  NPR:"Nepalese Rupee", NZD:"New Zealand Dollar", OMR:"Omani Rial", PAB:"Panamanian Balboa",
  PEN:"Peruvian Sol", PGK:"Papua New Guinean Kina", PHP:"Philippine Peso", PKR:"Pakistani Rupee",
  PLN:"Polish Zloty", PYG:"Paraguayan Guarani", QAR:"Qatari Rial", RON:"Romanian Leu",
  RSD:"Serbian Dinar", RUB:"Russian Ruble", RWF:"Rwandan Franc", SAR:"Saudi Riyal",
  SBD:"Solomon Islands Dollar", SCR:"Seychellois Rupee", SDG:"Sudanese Pound", SEK:"Swedish Krona",
  SGD:"Singapore Dollar", SHP:"Saint Helena Pound", SLE:"Sierra Leonean Leone", SOS:"Somali Shilling",
  SRD:"Surinamese Dollar", SSP:"South Sudanese Pound", STN:"São Tomé & Príncipe Dobra",
  SYP:"Syrian Pound", SZL:"Swazi Lilangeni", THB:"Thai Baht", TJS:"Tajikistani Somoni",
  TMT:"Turkmenistani Manat", TND:"Tunisian Dinar", TOP:"Tongan Paʻanga", TRY:"Turkish Lira",
  TTD:"Trinidad & Tobago Dollar", TWD:"New Taiwan Dollar", TZS:"Tanzanian Shilling",
  UAH:"Ukrainian Hryvnia", UGX:"Ugandan Shilling", USD:"US Dollar", UYU:"Uruguayan Peso",
  UZS:"Uzbekistani Som", VES:"Venezuelan Bolívar", VND:"Vietnamese Dong", VUV:"Vanuatu Vatu",
  WST:"Samoan Tala", XAF:"Central African CFA Franc", XCD:"East Caribbean Dollar",
  XOF:"West African CFA Franc", XPF:"CFP Franc", YER:"Yemeni Rial", ZAR:"South African Rand",
  ZMW:"Zambian Kwacha", ZWL:"Zimbabwean Dollar"
};

const ALL_CURRENCIES = Object.keys(CURRENCY_NAMES);

/* Strips accents so "krona" finds "Icelandic Króna" and "colon" finds
   "Costa Rican Colón" — nobody types the diacritics on a phone. */
function foldAccents(text){
  return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/* Folded, lowercased "CODE name" haystack per currency, built once. Without
   this the search would re-normalise ~160 strings on every keystroke. */
const SEARCH_INDEX = new Map(
  ALL_CURRENCIES.map(code => [code, foldAccents((code + " " + CURRENCY_NAMES[code]).toLowerCase())])
);

const STORAGE_KEY   = "rate-app-state-v3";
const THEME_KEY     = "convertor-theme";
const API_BASE      = "https://open.er-api.com/v6/latest/";
const DEFAULT_BASE  = "USD";
const DEFAULT_LIST  = ["EUR","GBP","NZD"];

/* The upstream feed publishes once a day, so re-fetching on every launch is
   wasted bandwidth. Cached rates newer than this are used as-is; Refresh in
   settings always forces a fetch regardless. */
const RATES_TTL_MS  = 30 * 60 * 1000;
/* Hard ceiling on a rates request, so a dead connection can't leave the
   status line stuck on "Updating rates…" forever. */
const FETCH_TIMEOUT_MS = 10000;

/* Row background colours cycle by position — the design's rotating palette
   (yellow, pink, teal, lime, mauve). */
const ROW_COLORS = ["#FFCF3C", "#FFB7F4", "#A8D8DA", "#C7D96B", "#C2B1B1"];

/* Intl formatters are expensive to construct, and fmt() runs once per row on
   every keystroke — so build them once here instead of inside the function. */
const AMOUNT_FMT = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
const DATE_FMT   = new Intl.DateTimeFormat(undefined, { month:"short", day:"numeric" });
const TIME_FMT   = new Intl.DateTimeFormat(undefined, { hour:"2-digit", minute:"2-digit" });


/* ============ 2. DOM references ============ */
/* Looked up once at load; every handler reuses them. */

const baseCcy              = document.getElementById("baseCcy");
const baseAmount           = document.getElementById("baseAmount");
const listEl               = document.getElementById("list");
const updatedLabel         = document.getElementById("updatedLabel");
const updatedLabelSettings = document.getElementById("updatedLabelSettings");
const statusLine           = document.getElementById("statusLine");
const addBtn               = document.getElementById("addBtn");
const addPicker            = document.getElementById("addPicker");
const searchInput          = document.getElementById("searchInput");
const searchResults        = document.getElementById("searchResults");
const themeSwitch          = document.getElementById("themeSwitch");
const themeColorMeta       = document.querySelector('meta[name="theme-color"]');
const refreshLink          = document.getElementById("refreshLink");
const menuBtn              = document.getElementById("menuBtn");
const closeMenuBtn         = document.getElementById("closeMenuBtn");
const settingsOverlay      = document.getElementById("settingsOverlay");


/* ============ 3. State and persistence ============ */

let rates      = null;              // { CODE: rate } expressed in ratesBase
let ratesBase  = null;              // which currency `rates` is relative to
let base       = DEFAULT_BASE;      // currency the user types into
let targetList = [...DEFAULT_LIST]; // codes shown as rows, in display order
let lastUpdated = null;             // ISO string of the rates' publish time
let baseValue  = 1;                 // the amount, in `base`

/* code -> { row, input } for the rendered rows. refreshValues() runs on every
   keystroke; walking this map avoids a querySelectorAll each time. */
const rowRefs = new Map();

let saveTimer = null;

/* Writes are debounced because typing changes baseValue on every keystroke and
   localStorage writes are synchronous (they block the main thread). */
function saveState(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 250);
}

function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      base, targetList, rates, ratesBase, lastUpdated, baseValue
    }));
  }catch(e){
    /* Quota exceeded or private mode — the app still works, it just won't
       remember this session. */
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

/* Make sure nothing typed in the last quarter second is lost when the app is
   backgrounded or closed. pagehide is the reliable one on iOS. */
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") flushSave();
});


/* ============ 4. Number formatting and parsing ============ */

/* Escapes text before it goes into innerHTML. The currency names are static,
   but this keeps the row/search templates safe if the data ever changes. */
const ESCAPES = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
function esc(value){
  return String(value).replace(/[&<>"']/g, ch => ESCAPES[ch]);
}

/* Display format: sub-unit amounts get 4 decimals so small rates stay useful,
   everything else gets locale grouping with 2 decimals. */
function fmt(n){
  if(typeof n !== "number" || !isFinite(n)) return "";
  if(n === 0) return "0";
  return Math.abs(n) < 1 ? n.toFixed(4) : AMOUNT_FMT.format(n);
}

/* Edit format: the same number with no grouping separators and a plain ".".
   A focused field switches to this so what the user edits always matches what
   the input sanitizer accepts — a locale-grouped "1 234,56" would otherwise be
   stripped down to a completely different number on the first keystroke. */
function fmtRaw(n){
  if(typeof n !== "number" || !isFinite(n)) return "";
  if(n === 0) return "0";
  let s = Math.abs(n) < 1 ? n.toFixed(4) : n.toFixed(2);
  if(s.indexOf(".") !== -1){
    s = s.replace(/0+$/, "").replace(/\.$/, "");   // drop trailing zeros only after a point
  }
  return s;
}

/* Keeps digits and at most one decimal point. A typed "," becomes "." so
   comma-decimal keyboards work; the old single-regex version also let "1.2.3"
   through, which parseFloat silently truncated to 1.2. */
function sanitizeNumeric(raw){
  let clean = raw.replace(/,/g, ".").replace(/[^0-9.]/g, "");
  const dot = clean.indexOf(".");
  if(dot !== -1){
    clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, "");
  }
  return clean;
}

/* Parses a sanitized field into a number, treating blank/partial input ("",
   ".") as 0 rather than NaN. */
function parseAmount(raw){
  const n = parseFloat(raw);
  return isFinite(n) ? n : 0;
}

/* Shrinks an input's font as the text gets longer so long numbers scale down
   instead of clipping. Only writes when the size actually changes — assigning
   style.fontSize unconditionally would invalidate layout on every keystroke. */
const AUTOSIZE_THRESHOLD = 6;   // characters that fit at full size
const AUTOSIZE_STEP = 1.8;      // px removed per extra character
function autosize(el, maxSize, minSize){
  const len = el.value.length || 1;
  const size = len > AUTOSIZE_THRESHOLD
    ? Math.max(minSize, maxSize - (len - AUTOSIZE_THRESHOLD) * AUTOSIZE_STEP)
    : maxSize;
  const px = size + "px";
  if(el.style.fontSize !== px) el.style.fontSize = px;
}
function autosizeBase(){ autosize(baseAmount, 38, 20); }
function autosizeRow(input){ autosize(input, 20, 16); }


/* ============ 5. Rates ============ */

let inflight = null;   // AbortController for the request in flight
let requestId = 0;     // guards against an older response landing last

/* True when the cached rates are for the current base and young enough to
   skip the network entirely. */
function ratesAreFresh(){
  if(!rates || ratesBase !== base || !lastUpdated) return false;
  const age = Date.now() - new Date(lastUpdated).getTime();
  return isFinite(age) && age >= 0 && age < RATES_TTL_MS;
}

/* Converts the cached table to a new base without a network call.
   Cross rates share a common origin, so newRate = rate[code] / rate[newBase]
   is exact. This makes switching base instant, and possible offline. */
function rebaseRates(nextBase){
  if(!rates) return false;
  const divisor = rates[nextBase];
  if(typeof divisor !== "number" || !isFinite(divisor) || divisor === 0) return false;

  const next = {};
  for(const code in rates){
    next[code] = rates[code] / divisor;
  }
  next[nextBase] = 1;
  rates = next;
  ratesBase = nextBase;
  return true;
}

function setStatus(text, isError){
  statusLine.textContent = text;
  statusLine.className = isError ? "status error" : "status";
}

/**
 * Fetches rates for the current base.
 * @param {object}  [opts]
 * @param {boolean} [opts.force]  ignore the freshness window
 * @param {boolean} [opts.quiet]  don't show "Updating rates…" (background refresh)
 */
async function fetchRates({ force = false, quiet = false } = {}){
  if(!force && ratesAreFresh()){
    updateLabels();
    return;
  }

  // Abandon any request still running: its base may already be stale.
  if(inflight) inflight.abort();
  const controller = new AbortController();
  inflight = controller;
  const myId = ++requestId;

  const requestedBase = base;
  const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  if(!quiet) setStatus("Updating rates…", false);

  try{
    const res = await fetch(API_BASE + encodeURIComponent(requestedBase), {
      signal: controller.signal,
      cache: "no-store"          // the SW skips this host; don't use the HTTP cache either
    });
    if(!res.ok) throw new Error("bad response " + res.status);

    const data = await res.json();
    if(data.result !== "success" || !data.rates) throw new Error("api error");

    // A newer request (or a base change) superseded this one — drop it.
    if(myId !== requestId || requestedBase !== base) return;

    rates = data.rates;
    rates[requestedBase] = 1;    // the API omits an exact 1.0 for the base
    ratesBase = requestedBase;
    lastUpdated = data.time_last_update_utc
      ? new Date(data.time_last_update_utc).toISOString()
      : new Date().toISOString();

    saveState();
    setStatus("", false);
    updateLabels();
    applyRates();
  }catch(err){
    if(myId !== requestId) return;            // superseded, not a real failure
    if(rates){
      setStatus("Offline — showing last saved rates", true);
      updateLabels();
      applyRates();
    }else{
      setStatus("Couldn't load rates. Check your connection.", true);
    }
  }finally{
    clearTimeout(timer);
    if(inflight === controller) inflight = null;
  }
}

function updateLabels(){
  if(!lastUpdated) return;
  const d = new Date(lastUpdated);
  if(isNaN(d.getTime())) return;
  const text = "Updated: " + DATE_FMT.format(d) + " " + TIME_FMT.format(d);
  updatedLabel.textContent = text;
  updatedLabelSettings.textContent = text;
}


/* ============ 6. Rendering ============ */

/* Builds all ~160 <option>s as one string. One innerHTML assignment is far
   cheaper than 160 createElement + appendChild calls. */
function populateBaseSelect(){
  baseCcy.innerHTML = ALL_CURRENCIES
    .map(c => `<option value="${c}">${c} — ${esc(CURRENCY_NAMES[c])}</option>`)
    .join("");
  baseCcy.value = base;
}

/* Currencies not already on screen (and not the base itself). */
function availableCurrencies(){
  return ALL_CURRENCIES.filter(c => c !== base && !targetList.includes(c));
}

function renderSearchResults(){
  const available = availableCurrencies();
  // Nothing left to add — hide the button rather than open an empty picker.
  addBtn.style.display = available.length ? "flex" : "none";

  // Fold the query the same way the index was folded, so accents don't matter.
  const query = foldAccents(searchInput.value.trim().toLowerCase());
  const matches = query
    ? available.filter(c => SEARCH_INDEX.get(c).includes(query))
    : available;

  if(matches.length === 0){
    searchResults.innerHTML = '<div class="search-empty">No currency matches that search</div>';
    return;
  }

  // Single innerHTML write; clicks are handled by one delegated listener below.
  searchResults.innerHTML = matches
    .map(code =>
      `<div class="search-item" data-code="${code}">` +
        `<span class="code">${code}</span>` +
        `<span class="name">${esc(CURRENCY_NAMES[code])}</span>` +
      `</div>`)
    .join("");
}

/* Rebuilds the row DOM. Call when the list, the base, or the rates change —
   never on a keystroke; refreshValues() handles that without touching the DOM
   structure. */
function buildList(){
  rowRefs.clear();

  listEl.innerHTML = targetList.map((code, index) => {
    const rate = rates ? rates[code] : null;
    const hasRate = typeof rate === "number" && isFinite(rate);
    const rateText = hasRate ? `1 ${base} = ${rate.toFixed(4)} ${code}` : "rate unavailable";
    const value = hasRate ? fmt(baseValue * rate) : "";
    const color = ROW_COLORS[index % ROW_COLORS.length];

    return `
      <div class="ccy-row" data-code="${code}" style="background:${color}">
        <div class="drag-handle" aria-label="Drag to reorder ${code}">
          <svg viewBox="0 0 12 20" width="12" height="20" aria-hidden="true">
            <circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/>
            <circle cx="3" cy="10" r="1.6"/><circle cx="9" cy="10" r="1.6"/>
            <circle cx="3" cy="17" r="1.6"/><circle cx="9" cy="17" r="1.6"/>
          </svg>
        </div>
        <div class="info">
          <div class="code-line">
            <span class="code">${code}</span>
            <span class="name">${esc(CURRENCY_NAMES[code] || "")}</span>
          </div>
          <div class="sub">${esc(rateText)}</div>
        </div>
        <input class="row-amount" type="text" inputmode="decimal" autocomplete="off" value="${esc(value)}" aria-label="${code} amount">
        <button class="remove-btn" aria-label="Remove ${code}">✕</button>
      </div>`;
  }).join("");

  // Cache the row parts once per build so the hot paths (refreshValues,
  // applyRates) never have to query the DOM again.
  for(const row of listEl.children){
    const input = row.querySelector(".row-amount");
    rowRefs.set(row.dataset.code, { row, input, sub: row.querySelector(".sub") });
    autosizeRow(input);
  }

  renderSearchResults();
}

/* Called after new rates arrive. A full buildList() replaces the DOM, which
   would steal focus and drop half-typed input, so while a field is being
   edited we patch the rate captions and idle amounts in place instead. */
function applyRates(){
  const active = document.activeElement;
  const editing = active === baseAmount ||
    (active && active.classList && active.classList.contains("row-amount"));

  if(!editing){
    buildList();
    return;
  }

  for(const [code, ref] of rowRefs){
    const rate = rates ? rates[code] : null;
    const hasRate = typeof rate === "number" && isFinite(rate);
    if(ref.sub){
      ref.sub.textContent = hasRate ? `1 ${base} = ${rate.toFixed(4)} ${code}` : "rate unavailable";
    }
  }
  refreshValues(active);
}

/* Writes current values into every input from baseValue, without rebuilding
   the DOM, so focus and cursor position survive. `skipEl` is the field the
   user is typing in — overwriting it would eat characters like a trailing
   decimal point. */
function refreshValues(skipEl){
  if(baseAmount !== skipEl){
    baseAmount.value = fmt(baseValue);
    autosizeBase();
  }

  for(const [code, ref] of rowRefs){
    if(ref.input === skipEl) continue;
    const rate = rates ? rates[code] : null;
    if(typeof rate === "number" && isFinite(rate)){
      ref.input.value = fmt(baseValue * rate);
      autosizeRow(ref.input);
    }
  }
}


/* ============ 7. Interaction ============ */

/* ---- Amount editing ---- */

function onBaseEdit(){
  baseValue = parseAmount(baseAmount.value);
  autosizeBase();
  refreshValues(baseAmount);   // skip the field being typed in
  saveState();
}

function onRowEdit(code, input){
  const rate = rates ? rates[code] : null;
  if(typeof rate !== "number" || !isFinite(rate) || rate === 0) return;
  baseValue = parseAmount(input.value) / rate;
  autosizeRow(input);
  refreshValues(input);
  saveState();
}

/* A field being edited shows the plain, un-grouped number; an idle field shows
   the grouped display format. */
baseAmount.addEventListener("focus", () => {
  baseAmount.value = fmtRaw(baseValue);
  autosizeBase();
  baseAmount.select();
});
baseAmount.addEventListener("blur", () => {
  baseAmount.value = fmt(baseValue);
  autosizeBase();
});
baseAmount.addEventListener("input", () => {
  baseAmount.value = sanitizeNumeric(baseAmount.value);
  onBaseEdit();
});

/* The converted amount currently shown by a row, or NaN when its rate is
   missing. */
function rowNumber(code){
  const rate = rates ? rates[code] : null;
  return (typeof rate === "number" && isFinite(rate)) ? baseValue * rate : NaN;
}

/* Row inputs and remove buttons use delegated listeners on the container, so
   rebuilding the list attaches no per-row handlers at all. */
listEl.addEventListener("focusin", (e) => {
  const input = e.target;
  if(!input.classList.contains("row-amount")) return;
  const row = input.closest(".ccy-row");
  if(!row) return;                       // input already detached by a rebuild
  const n = rowNumber(row.dataset.code);
  if(isFinite(n)){
    input.value = fmtRaw(n);
    autosizeRow(input);
  }
  input.select();
});

listEl.addEventListener("focusout", (e) => {
  const input = e.target;
  if(!input.classList.contains("row-amount")) return;
  const row = input.closest(".ccy-row");
  if(!row) return;                       // input already detached by a rebuild
  const n = rowNumber(row.dataset.code);
  if(isFinite(n)){
    input.value = fmt(n);
    autosizeRow(input);
  }
});

listEl.addEventListener("input", (e) => {
  const input = e.target;
  if(!input.classList.contains("row-amount")) return;
  const row = input.closest(".ccy-row");
  if(!row) return;
  input.value = sanitizeNumeric(input.value);
  onRowEdit(row.dataset.code, input);
});

listEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".remove-btn");
  if(!btn) return;
  const row = btn.closest(".ccy-row");
  if(!row) return;
  const code = row.dataset.code;
  targetList = targetList.filter(c => c !== code);
  flushSave();
  buildList();
});


/* ---- Add currency ---- */

function addCurrency(code){
  if(targetList.includes(code)) return;
  targetList.push(code);
  addPicker.classList.remove("open");
  addBtn.setAttribute("aria-expanded", "false");
  searchInput.value = "";
  flushSave();
  buildList();
  // The feed returns every currency at once, so a missing rate means the cache
  // predates this code. Refresh quietly rather than blocking the row.
  if(rates && rates[code] == null) fetchRates({ force: true, quiet: true });
}

addBtn.addEventListener("click", () => {
  const open = addPicker.classList.toggle("open");
  addBtn.setAttribute("aria-expanded", open ? "true" : "false");
  if(open){
    renderSearchResults();
    searchInput.focus();
  }
});

searchInput.addEventListener("input", renderSearchResults);

// One delegated click handler instead of a listener per result row.
searchResults.addEventListener("click", (e) => {
  const item = e.target.closest(".search-item");
  if(item) addCurrency(item.dataset.code);
});


/* ---- Base currency ---- */

baseCcy.addEventListener("change", () => {
  base = baseCcy.value;
  targetList = targetList.filter(c => c !== base);

  // Convert what we already have so the new base renders instantly (and works
  // offline); then refresh from the network in the background.
  const rebased = rebaseRates(base);
  flushSave();
  if(rebased){
    buildList();
    fetchRates({ force: true, quiet: true });
  }else{
    rates = null;
    ratesBase = null;
    buildList();
    fetchRates({ force: true });
  }
});


/* ---- Drag to reorder ----
   Pointer Events, so one implementation covers touch, pen and mouse (HTML5
   drag-and-drop doesn't work on mobile). The dragged row follows the finger,
   its neighbours slide to open a gap, and the order is committed on release.
   A single delegated pointerdown serves every row. */

let drag = null;

listEl.addEventListener("pointerdown", (e) => {
  const handle = e.target.closest(".drag-handle");
  if(!handle || drag) return;
  const row = handle.closest(".ccy-row");
  if(!row) return;

  e.preventDefault();

  // Measure every row once, up front: reading rects during pointermove would
  // force a layout on each frame.
  const rows = Array.from(listEl.children);
  const tops = rows.map(r => r.getBoundingClientRect().top);
  const index = rows.indexOf(row);

  drag = {
    handle, row, rows,
    startY: e.clientY,
    fromIndex: index,
    toIndex: index,
    // Distance between row origins: real spacing when we have two rows,
    // otherwise height + the CSS gap.
    pitch: rows.length > 1 ? (tops[1] - tops[0]) : (row.offsetHeight + 12)
  };

  listEl.classList.add("dragging-active");
  row.classList.add("dragging");
  handle.setPointerCapture(e.pointerId);
  handle.addEventListener("pointermove", onDragMove);
  handle.addEventListener("pointerup", onDragEnd);
  handle.addEventListener("pointercancel", onDragEnd);
});

function onDragMove(e){
  if(!drag) return;
  const deltaY = e.clientY - drag.startY;
  drag.row.style.transform = `translateY(${deltaY}px)`;

  // Which slot the row would land in if released now.
  let next = drag.fromIndex + Math.round(deltaY / drag.pitch);
  next = Math.max(0, Math.min(drag.rows.length - 1, next));
  if(next === drag.toIndex) return;   // nothing to re-shift
  drag.toIndex = next;

  // Shift the rows between the origin and the target to open the gap.
  drag.rows.forEach((r, i) => {
    if(r === drag.row) return;
    let shift = 0;
    if(drag.fromIndex < drag.toIndex && i > drag.fromIndex && i <= drag.toIndex){
      shift = -drag.pitch;
    }else if(drag.fromIndex > drag.toIndex && i >= drag.toIndex && i < drag.fromIndex){
      shift = drag.pitch;
    }
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
}

function onDragEnd(e){
  if(!drag) return;
  const { handle, row, rows, fromIndex, toIndex } = drag;
  drag = null;

  try{ handle.releasePointerCapture(e.pointerId); }catch(err){ /* already released */ }
  handle.removeEventListener("pointermove", onDragMove);
  handle.removeEventListener("pointerup", onDragEnd);
  handle.removeEventListener("pointercancel", onDragEnd);

  row.classList.remove("dragging");
  listEl.classList.remove("dragging-active");
  rows.forEach(r => { r.style.transform = ""; });

  if(toIndex !== fromIndex){
    const [moved] = targetList.splice(fromIndex, 1);
    targetList.splice(toIndex, 0, moved);
    flushSave();
    buildList();   // re-renders so the position-based colours stay in order
  }
}


/* ---- Settings sheet ---- */

function openSettings(){
  settingsOverlay.classList.add("open");
  settingsOverlay.removeAttribute("inert");
  settingsOverlay.setAttribute("aria-hidden", "false");
  menuBtn.setAttribute("aria-expanded", "true");
  closeMenuBtn.focus();
}

function closeSettings(){
  settingsOverlay.classList.remove("open");
  settingsOverlay.setAttribute("inert", "");
  settingsOverlay.setAttribute("aria-hidden", "true");
  menuBtn.setAttribute("aria-expanded", "false");
  menuBtn.focus();
}

menuBtn.addEventListener("click", openSettings);
closeMenuBtn.addEventListener("click", closeSettings);
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && settingsOverlay.classList.contains("open")) closeSettings();
});

/* Refresh forces a rates fetch instead of reloading the page — same result,
   no white flash — and asks the service worker to check for a new build. */
refreshLink.addEventListener("click", async (e) => {
  e.preventDefault();
  if(refreshLink.getAttribute("aria-disabled") === "true") return;
  refreshLink.setAttribute("aria-disabled", "true");
  refreshLink.textContent = "Refreshing…";
  try{
    await fetchRates({ force: true });
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) reg.update().catch(() => {});
    }
  }finally{
    refreshLink.textContent = "Refresh";
    refreshLink.removeAttribute("aria-disabled");
  }
});


/* ---- Theme ---- */

function systemPrefersDark(){
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}

function readStoredTheme(){
  try{ return localStorage.getItem(THEME_KEY); }catch(e){ return null; }
}

function applyTheme(theme){
  const isDark = theme === "dark";
  document.documentElement.setAttribute("data-theme", theme);
  themeSwitch.setAttribute("aria-checked", isDark ? "true" : "false");

  const iconPath = isDark ? "icon/Icon-192-dark.png" : "icon/Icon-192.png";
  const appIcon = document.getElementById("appIcon");
  const appleIcon = document.getElementById("appleIcon");
  if(appIcon) appIcon.setAttribute("href", iconPath);
  if(appleIcon) appleIcon.setAttribute("href", iconPath);
  if(themeColorMeta) themeColorMeta.setAttribute("content", isDark ? "#1A1A1A" : "#EEEEEE");
}

/* Sync the switch with whatever the inline bootstrap already painted. */
applyTheme(document.documentElement.getAttribute("data-theme") || "light");

themeSwitch.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){ /* ignore */ }
  applyTheme(next);
});

/* Follow the OS only while the user hasn't picked a theme themselves. */
function followSystemTheme(){
  if(!readStoredTheme()) applyTheme(systemPrefersDark() ? "dark" : "light");
}

if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onChange = () => followSystemTheme();
  if(mq.addEventListener) mq.addEventListener("change", onChange);
  else if(mq.addListener) mq.addListener(onChange);   // Safari < 14
}


/* ---- Returning to the app ---- */

/* iOS doesn't fire matchMedia changes for a backgrounded PWA, so re-check the
   theme on resume. Stale rates are refreshed at the same time. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible") return;
  followSystemTheme();
  if(!ratesAreFresh()) fetchRates({ quiet: true });
});
window.addEventListener("pageshow", followSystemTheme);

// Connection came back: quietly pick up rates we couldn't fetch before.
window.addEventListener("online", () => fetchRates({ force: true, quiet: true }));


/* ============ 8. Boot ============ */

function init(){
  const saved = loadState();
  if(saved){
    base        = saved.base || DEFAULT_BASE;
    targetList  = Array.isArray(saved.targetList) ? saved.targetList : [...DEFAULT_LIST];
    rates       = saved.rates || null;
    // v3 states written before ratesBase existed always matched `base`.
    ratesBase   = saved.ratesBase || (saved.rates ? base : null);
    lastUpdated = saved.lastUpdated || null;
    baseValue   = typeof saved.baseValue === "number" ? saved.baseValue : 1;
  }

  populateBaseSelect();
  baseAmount.value = fmt(baseValue);
  autosizeBase();
  updateLabels();

  // Paint from cache first so the app is usable before the network answers.
  buildList();

  if(ratesAreFresh()){
    setStatus("", false);
  }else{
    fetchRates({ quiet: !!rates });   // quiet when we already have something on screen
  }
}

init();

/* Service worker: offline support and asset caching. updateViaCache:"none"
   stops the browser serving sw.js itself from the HTTP cache, so updates are
   picked up on the next visit. */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  });
}
</script>

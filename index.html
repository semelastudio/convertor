<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Convertor</title>
<meta name="theme-color" content="#16233D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Convertor">
<style>
  :root{
    --ink:#16233D;
    --ink-soft:#2B3A57;
    --paper:#EEF1F5;
    --card:#FFFFFF;
    --gold:#C98A2C;
    --teal:#2E6E62;
    --line:#D8DEE7;
    --muted:#6B7686;
    --danger:#B14B3F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 20px 60px;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  .app{
    width:100%;
    max-width:400px;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 4px;
  }
  .masthead h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .masthead .updated{
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .base-card{
    background:var(--card);
    border-radius:20px;
    padding:18px 20px;
    box-shadow:0 1px 2px rgba(22,35,61,0.06), 0 12px 28px rgba(22,35,61,0.08);
    border:1px solid var(--line);
    margin-bottom:14px;
  }
  .base-row{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .base-select-line{
    display:flex;
    align-items:center;
  }
  .select-wrap{
    position:relative;
    flex-shrink:0;
  }
  .select-wrap::after{
    content:"";
    position:absolute;
    right:2px;
    top:9px;
    width:7px;
    height:7px;
    border-right:1.5px solid var(--muted);
    border-bottom:1.5px solid var(--muted);
    transform:rotate(45deg);
    pointer-events:none;
  }
  .ccy-select{
    background:transparent;
    border:none;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    padding:2px 16px 4px 0;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    max-width:100%;
  }
  .base-amount{
    width:100%;
    border:none;
    background:transparent;
    font-size:34px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    padding:0;
    letter-spacing:-0.01em;
    text-align:right;
  }
  .base-amount:focus{outline:none;}

  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .ccy-row{
    background:var(--card);
    border-radius:16px;
    padding:12px 14px 12px 18px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .ccy-row .info{
    flex:1;
    min-width:0;
  }
  .ccy-row .code-line{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .ccy-row .code{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    color:var(--ink-soft);
  }
  .ccy-row .name{
    font-size:12px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .ccy-row .sub{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .row-amount{
    width:130px;
    flex-shrink:0;
    border:none;
    background:transparent;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    padding:0;
    text-align:right;
  }
  .row-amount:focus{ outline:none; }
  .remove-btn{
    width:24px;
    height:24px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:17px;
    line-height:1;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .remove-btn:hover{ background:#F3E7E4; color:var(--danger); }

  .add-row{
    margin-top:14px;
  }
  .add-btn{
    width:100%;
    padding:13px 14px;
    border-radius:16px;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--muted);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .add-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .add-btn .plus{
    font-size:16px;
    font-weight:400;
  }

  .add-picker{
    margin-top:10px;
    display:none;
    flex-direction:column;
    gap:8px;
  }
  .add-picker.open{ display:flex; }
  .search-input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:16px;
    color:var(--ink);
  }
  .search-input:focus{
    outline:none;
    border-color:var(--gold);
  }
  .search-results{
    max-height:240px;
    overflow-y:auto;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--card);
  }
  .search-item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:11px 14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .search-item:last-child{ border-bottom:none; }
  .search-item:hover{ background:var(--paper); }
  .search-item .code{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .search-item .name{
    font-size:12.5px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .search-empty{
    padding:14px;
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
  }

  .status{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    margin-top:16px;
    min-height:14px;
    padding:0 8px;
  }
  .status.error{ color:var(--danger); }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <h1>Convertor</h1>
    <span class="updated" id="updatedLabel">—</span>
  </div>

  <div class="base-card">
    <div class="base-row">
      <div class="base-select-line">
        <div class="select-wrap">
          <select class="ccy-select" id="baseCcy" aria-label="Base currency"></select>
        </div>
      </div>
      <input class="base-amount" id="baseAmount" inputmode="decimal" type="text" value="1" aria-label="Amount">
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="add-row">
    <button class="add-btn" id="addBtn"><span class="plus">+</span> Add currency</button>
    <div class="add-picker" id="addPicker">
      <input class="search-input" id="searchInput" type="text" placeholder="Search by code or name…" aria-label="Search currency" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="status" id="statusLine"></div>
</div>

<script>
const CURRENCY_NAMES = {
  AED:"UAE Dirham", AFN:"Afghan Afghani", ALL:"Albanian Lek", AMD:"Armenian Dram",
  ANG:"Netherlands Antillean Guilder", AOA:"Angolan Kwanza", ARS:"Argentine Peso",
  AUD:"Australian Dollar", AWG:"Aruban Florin", AZN:"Azerbaijani Manat", BAM:"Bosnia-Herzegovina Mark",
  BBD:"Barbadian Dollar", BDT:"Bangladeshi Taka", BGN:"Bulgarian Lev", BHD:"Bahraini Dinar",
  BIF:"Burundian Franc", BMD:"Bermudan Dollar", BND:"Brunei Dollar", BOB:"Bolivian Boliviano",
  BRL:"Brazilian Real", BSD:"Bahamian Dollar", BTN:"Bhutanese Ngultrum", BWP:"Botswanan Pula",
  BYN:"Belarusian Ruble", BZD:"Belize Dollar", CAD:"Canadian Dollar", CDF:"Congolese Franc",
  CHF:"Swiss Franc", CLP:"Chilean Peso", CNY:"Chinese Yuan", COP:"Colombian Peso",
  CRC:"Costa Rican Colón", CUP:"Cuban Peso", CVE:"Cape Verdean Escudo", CZK:"Czech Koruna",
  DJF:"Djiboutian Franc", DKK:"Danish Krone", DOP:"Dominican Peso", DZD:"Algerian Dinar",
  EGP:"Egyptian Pound", ERN:"Eritrean Nakfa", ETB:"Ethiopian Birr", EUR:"Euro",
  FJD:"Fijian Dollar", FKP:"Falkland Islands Pound", GBP:"British Pound", GEL:"Georgian Lari",
  GHS:"Ghanaian Cedi", GIP:"Gibraltar Pound", GMD:"Gambian Dalasi", GNF:"Guinean Franc",
  GTQ:"Guatemalan Quetzal", GYD:"Guyanaese Dollar", HKD:"Hong Kong Dollar", HNL:"Honduran Lempira",
  HTG:"Haitian Gourde", HUF:"Hungarian Forint", IDR:"Indonesian Rupiah", ILS:"Israeli Shekel",
  INR:"Indian Rupee", IQD:"Iraqi Dinar", IRR:"Iranian Rial", ISK:"Icelandic Króna",
  JMD:"Jamaican Dollar", JOD:"Jordanian Dinar", JPY:"Japanese Yen", KES:"Kenyan Shilling",
  KGS:"Kyrgystani Som", KHR:"Cambodian Riel", KMF:"Comorian Franc", KPW:"North Korean Won",
  KRW:"South Korean Won", KWD:"Kuwaiti Dinar", KYD:"Cayman Islands Dollar", KZT:"Kazakhstani Tenge",
  LAK:"Laotian Kip", LBP:"Lebanese Pound", LKR:"Sri Lankan Rupee", LRD:"Liberian Dollar",
  LSL:"Lesotho Loti", LYD:"Libyan Dinar", MAD:"Moroccan Dirham", MDL:"Moldovan Leu",
  MGA:"Malagasy Ariary", MKD:"Macedonian Denar", MMK:"Myanmar Kyat", MNT:"Mongolian Tugrik",
  MOP:"Macanese Pataca", MRU:"Mauritanian Ouguiya", MUR:"Mauritian Rupee", MVR:"Maldivian Rufiyaa",
  MWK:"Malawian Kwacha", MXN:"Mexican Peso", MYR:"Malaysian Ringgit", MZN:"Mozambican Metical",
  NAD:"Namibian Dollar", NGN:"Nigerian Naira", NIO:"Nicaraguan Córdoba", NOK:"Norwegian Krone",
  NPR:"Nepalese Rupee", NZD:"New Zealand Dollar", OMR:"Omani Rial", PAB:"Panamanian Balboa",
  PEN:"Peruvian Sol", PGK:"Papua New Guinean Kina", PHP:"Philippine Peso", PKR:"Pakistani Rupee",
  PLN:"Polish Zloty", PYG:"Paraguayan Guarani", QAR:"Qatari Rial", RON:"Romanian Leu",
  RSD:"Serbian Dinar", RUB:"Russian Ruble", RWF:"Rwandan Franc", SAR:"Saudi Riyal",
  SBD:"Solomon Islands Dollar", SCR:"Seychellois Rupee", SDG:"Sudanese Pound", SEK:"Swedish Krona",
  SGD:"Singapore Dollar", SHP:"Saint Helena Pound", SLE:"Sierra Leonean Leone", SOS:"Somali Shilling",
  SRD:"Surinamese Dollar", SSP:"South Sudanese Pound", STN:"São Tomé & Príncipe Dobra",
  SYP:"Syrian Pound", SZL:"Swazi Lilangeni", THB:"Thai Baht", TJS:"Tajikistani Somoni",
  TMT:"Turkmenistani Manat", TND:"Tunisian Dinar", TOP:"Tongan Paʻanga", TRY:"Turkish Lira",
  TTD:"Trinidad & Tobago Dollar", TWD:"New Taiwan Dollar", TZS:"Tanzanian Shilling",
  UAH:"Ukrainian Hryvnia", UGX:"Ugandan Shilling", USD:"US Dollar", UYU:"Uruguayan Peso",
  UZS:"Uzbekistani Som", VES:"Venezuelan Bolívar", VND:"Vietnamese Dong", VUV:"Vanuatu Vatu",
  WST:"Samoan Tala", XAF:"Central African CFA Franc", XCD:"East Caribbean Dollar",
  XOF:"West African CFA Franc", XPF:"CFP Franc", YER:"Yemeni Rial", ZAR:"South African Rand",
  ZMW:"Zambian Kwacha", ZWL:"Zimbabwean Dollar"
};
const ALL_CURRENCIES = Object.keys(CURRENCY_NAMES);
const STORAGE_KEY = "rate-app-state-v3";
const DEFAULT_BASE = "USD";
const DEFAULT_LIST = ["EUR","GBP","NZD"];

const baseCcy = document.getElementById("baseCcy");
const baseAmount = document.getElementById("baseAmount");
const listEl = document.getElementById("list");
const updatedLabel = document.getElementById("updatedLabel");
const statusLine = document.getElementById("statusLine");
const addBtn = document.getElementById("addBtn");
const addPicker = document.getElementById("addPicker");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

let rates = null;
let base = DEFAULT_BASE;
let targetList = [...DEFAULT_LIST];
let lastUpdated = null;
let baseValue = 1;

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    base, targetList, rates, lastUpdated, baseValue
  }));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function ccyLabel(code){
  return `${code} — ${CURRENCY_NAMES[code] || ""}`;
}

function populateBaseSelect(){
  baseCcy.innerHTML = "";
  ALL_CURRENCIES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = ccyLabel(c);
    baseCcy.appendChild(opt);
  });
  baseCcy.value = base;
}

function availableCurrencies(){
  return ALL_CURRENCIES.filter(c => c !== base && !targetList.includes(c));
}

function renderSearchResults(){
  const available = availableCurrencies();
  addBtn.style.display = available.length ? "flex" : "none";

  const query = searchInput.value.trim().toLowerCase();
  const matches = query
    ? available.filter(c =>
        c.toLowerCase().includes(query) ||
        (CURRENCY_NAMES[c] || "").toLowerCase().includes(query))
    : available;

  searchResults.innerHTML = "";

  if(matches.length === 0){
    const empty = document.createElement("div");
    empty.className = "search-empty";
    empty.textContent = "No currency matches that search";
    searchResults.appendChild(empty);
    return;
  }

  matches.forEach(code => {
    const item = document.createElement("div");
    item.className = "search-item";
    item.innerHTML = `<span class="code">${code}</span><span class="name">${CURRENCY_NAMES[code] || ""}</span>`;
    item.addEventListener("click", () => addCurrency(code));
    searchResults.appendChild(item);
  });
}

async function addCurrency(code){
  targetList.push(code);
  addPicker.classList.remove("open");
  searchInput.value = "";
  saveState();
  if(rates && rates[code] == null){
    await fetchRates();
  } else {
    buildList();
  }
}

function updateLabels(){
  if(lastUpdated){
    const d = new Date(lastUpdated);
    updatedLabel.textContent = d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) +
      " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }
}

function fmt(n){
  if(isNaN(n)) return "";
  return n < 1 ? n.toFixed(4) : n.toLocaleString(undefined,{maximumFractionDigits:2});
}

// Shrinks an input's font as its text gets longer, so long numbers
// never clip instead of overflowing the field.
function autosize(el, maxSize, minSize){
  const len = el.value.length || 1;
  const threshold = 6;
  let size = maxSize;
  if(len > threshold){
    size = Math.max(minSize, maxSize - (len - threshold) * 1.8);
  }
  el.style.fontSize = size + "px";
}
function autosizeBase(){ autosize(baseAmount, 34, 18); }
function autosizeRow(input){ autosize(input, 19, 16); }

async function fetchRates(){
  try{
    statusLine.textContent = "Updating rates…";
    statusLine.className = "status";
    const res = await fetch(`https://open.er-api.com/v6/latest/${base}`);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    if(data.result !== "success") throw new Error("api error");
    rates = data.rates;
    rates[base] = 1;
    lastUpdated = data.time_last_update_utc ? new Date(data.time_last_update_utc).toISOString() : new Date().toISOString();
    saveState();
    statusLine.textContent = "";
    updateLabels();
    buildList();
  }catch(err){
    if(rates){
      statusLine.textContent = "Offline — showing last saved rates";
      statusLine.className = "status error";
      updateLabels();
      buildList();
    }else{
      statusLine.textContent = "Couldn't load rates. Check your connection.";
      statusLine.className = "status error";
    }
  }
}

// Rebuilds the row DOM structure. Call only when the list itself, the base
// currency, or freshly fetched rates change — not on every keystroke.
function buildList(){
  listEl.innerHTML = "";

  targetList.forEach(code => {
    const rate = rates ? rates[code] : null;
    const row = document.createElement("div");
    row.className = "ccy-row";
    row.dataset.code = code;

    const rateText = rate != null ? `1 ${base} = ${rate.toFixed(4)} ${code}` : "rate unavailable";
    const value = rate != null ? fmt(baseValue * rate) : "";

    row.innerHTML = `
      <div class="info">
        <div class="code-line">
          <span class="code">${code}</span>
          <span class="name">${CURRENCY_NAMES[code] || ""}</span>
        </div>
        <div class="sub">${rateText}</div>
      </div>
      <input class="row-amount" type="text" inputmode="decimal" value="${value}" aria-label="${code} amount">
      <button class="remove-btn" aria-label="Remove ${code}" data-code="${code}">✕</button>
    `;
    listEl.appendChild(row);

    const input = row.querySelector(".row-amount");
    autosizeRow(input);
    input.addEventListener("focus", () => input.select());
    input.addEventListener("input", () => {
      input.value = input.value.replace(/[^0-9.]/g, "");
      onRowEdit(code, input.value);
    });

    row.querySelector(".remove-btn").addEventListener("click", () => {
      targetList = targetList.filter(c => c !== code);
      saveState();
      buildList();
      renderSearchResults();
    });
  });

  renderSearchResults();
}

// Updates every input's displayed value from the current baseValue,
// without rebuilding the DOM (so focus/cursor position is preserved).
function refreshValues(skipCode){
  baseAmount.value = fmt(baseValue) || baseAmount.value;
  autosizeBase();

  listEl.querySelectorAll(".ccy-row").forEach(row => {
    const code = row.dataset.code;
    if(code === skipCode) return;
    const rate = rates ? rates[code] : null;
    const input = row.querySelector(".row-amount");
    if(rate != null){
      input.value = fmt(baseValue * rate);
      autosizeRow(input);
    }
  });
}

function onBaseEdit(){
  const amt = parseFloat(baseAmount.value);
  baseValue = isNaN(amt) ? 0 : amt;
  autosizeBase();
  refreshValues(null);
}

function onRowEdit(code, rawValue){
  if(!rates || rates[code] == null) return;
  const amt = parseFloat(rawValue);
  const numeric = isNaN(amt) ? 0 : amt;
  baseValue = numeric / rates[code];
  const editedInput = listEl.querySelector(`.ccy-row[data-code="${code}"] .row-amount`);
  if(editedInput) autosizeRow(editedInput);
  refreshValues(code);
}

baseAmount.addEventListener("focus", () => baseAmount.select());
baseAmount.addEventListener("input", () => {
  baseAmount.value = baseAmount.value.replace(/[^0-9.]/g,"");
  autosizeBase();
  onBaseEdit();
});

baseCcy.addEventListener("change", async () => {
  base = baseCcy.value;
  targetList = targetList.filter(c => c !== base);
  saveState();
  await fetchRates();
});

addBtn.addEventListener("click", () => {
  addPicker.classList.toggle("open");
  if(addPicker.classList.contains("open")){
    renderSearchResults();
    searchInput.focus();
  }
});

searchInput.addEventListener("input", renderSearchResults);

async function init(){
  const saved = loadState();
  if(saved){
    base = saved.base || DEFAULT_BASE;
    targetList = saved.targetList || [...DEFAULT_LIST];
    rates = saved.rates || null;
    lastUpdated = saved.lastUpdated || null;
    baseValue = typeof saved.baseValue === "number" ? saved.baseValue : 1;
  }
  populateBaseSelect();
  baseCcy.value = base;
  baseAmount.value = fmt(baseValue);
  autosizeBase();
  updateLabels();
  if(rates) buildList();
  fetchRates();
}

init();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
